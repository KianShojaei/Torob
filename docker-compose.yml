services:
  app:
    build: .
    image: torbgard:latest
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-4-5}
      DEMO_MODE: "true"
      CONTACT_TIMEOUT_SECONDS: ${CONTACT_TIMEOUT_SECONDS:-45}
    restart: unless-stopped
