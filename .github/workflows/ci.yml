name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Generate a small schema-faithful dataset
        run: cd backend && python -m app.etl.synthetic --out ../data --shops 300 --products 3000 --offers 7000
      - name: Build the serving database
        run: cd backend && python -m app.etl.build --data ../data --db var/app.db
      - name: Validate ETL invariants
        run: cd backend && python -m app.etl.validate --db var/app.db
      - name: Unit + API + agent eval tests
        run: cd backend && python -m pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm install --no-audit --no-fund
      - run: cd frontend && npx tsc --noEmit
      - run: cd frontend && npm run build

  docker:
    name: Container build
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t torbgard:ci .
